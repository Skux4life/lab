AWSTemplateFormatVersion: '2010-09-09'
Description: Minimal CloudFormation template for a Python Lambda function

Parameters:
  FunctionName:
    Type: String
    Default: hello-world
    Description: Base name of the Lambda function

  EnvironmentName:
    Type: String
    Default: dev
    Description: Deployment environment name

  MemorySize:
    Type: Number
    Default: 128
    MinValue: 128
    MaxValue: 10240
    Description: Lambda memory size in MB

  Timeout:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 900
    Description: Lambda timeout in seconds

Resources:
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${FunctionName}-${EnvironmentName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${FunctionName}-${EnvironmentName}'
      RetentionInDays: 14

  HelloWorldFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${FunctionName}-${EnvironmentName}'
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Architectures:
        - arm64
      Environment:
        Variables:
          STAGE: !Ref EnvironmentName
      Code:
        ZipFile: |
          import json
          import os

          def handler(event, context):
              return {
                  "statusCode": 200,
                  "headers": {
                      "Content-Type": "application/json"
                  },
                  "body": json.dumps({
                      "message": "Hello from Lambda",
                      "stage": os.environ.get("STAGE", "unknown"),
                      "input": event
                  })
              }

Outputs:
  FunctionName:
    Description: Lambda function name
    Value: !Ref HelloWorldFunction

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt HelloWorldFunction.Arn

  RoleArn:
    Description: IAM role ARN used by the Lambda function
    Value: !GetAtt LambdaExecutionRole.Arn
